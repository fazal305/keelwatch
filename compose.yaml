# Keelwatch production stack. See docs/deployment.md.
#
#   cp .env.example .env    # fill in secrets; set KEELWATCH_DOMAIN
#   docker compose up -d --build
#   docker compose run --rm api php api/bin/user.php create admin --role=admin
#
# Services: db (MySQL), migrate (one-shot), api (PHP-FPM), worker (Python),
# web (Caddy: HTTPS, dashboard, FastCGI to api). Only web publishes ports.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "3306"
    # The app connects as DB_USER; keep the root password out of its environment.
    MYSQL_ROOT_PASSWORD: ""
  restart: unless-stopped
  logging: *logging

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-keelwatch}
      MYSQL_USER: ${DB_USER:?set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    # The image's temporary init server answers mysqladmin ping before users
    # exist; an authenticated query over TCP only succeeds on the final server.
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *app
    image: keelwatch-api:${KEELWATCH_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    command: ["php", "api/bin/migrate.php"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    image: keelwatch-api:${KEELWATCH_VERSION:-local}
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    image: keelwatch-worker:${KEELWATCH_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      # Optional GitHub App private key: put it in ./secrets and set
      # GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/keelwatch/<file name>.
      - ./secrets:/run/secrets/keelwatch:ro

  web:
    image: keelwatch-web:${KEELWATCH_VERSION:-local}
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      KEELWATCH_DOMAIN: ${KEELWATCH_DOMAIN:-localhost}
    ports:
      - "${KEELWATCH_HTTP_PORT:-80}:80"
      - "${KEELWATCH_HTTPS_PORT:-443}:443"
      - "${KEELWATCH_HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
