name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  APP_VERSION: ci
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_NAME: keelwatch
  DB_TEST_NAME: keelwatch_test
  DB_USER: root

jobs:
  api:
    name: API (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Throwaway secrets for a container and a job that live only for this run.
      - name: Generate job secrets
        run: |
          pw="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "::add-mask::$app"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "APP_SECRET=$app" >> "$GITHUB_ENV"

      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.4
          # The image first runs a temporary server (socket only, before the
          # root password is set) that already answers mysqladmin ping. Wait
          # for an authenticated query over TCP, which only the final server
          # accepts.
          for i in $(seq 1 60); do
            docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
              -e "SELECT 1" >/dev/null 2>&1 && ready=1 && break
            sleep 2
          done
          [ -n "$ready" ] || { docker logs mysql | tail -20; exit 1; }
          docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
            -e "CREATE DATABASE keelwatch; CREATE DATABASE keelwatch_test;"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --no-progress

      - name: Lint
        working-directory: api
        run: php bin/lint.php

      - name: Unit and contract tests
        working-directory: api
        run: vendor/bin/phpunit --testsuite unit,contract

      - name: Integration tests
        working-directory: api
        run: vendor/bin/phpunit --testsuite integration

  worker:
    name: Worker (Python)
    runs-on: ubuntu-latest
    needs: api
    steps:
      - uses: actions/checkout@v4

      - name: Generate job secrets
        run: |
          pw="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "::add-mask::$app"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "APP_SECRET=$app" >> "$GITHUB_ENV"

      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.4
          # The image first runs a temporary server (socket only, before the
          # root password is set) that already answers mysqladmin ping. Wait
          # for an authenticated query over TCP, which only the final server
          # accepts.
          for i in $(seq 1 60); do
            docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
              -e "SELECT 1" >/dev/null 2>&1 && ready=1 && break
            sleep 2
          done
          [ -n "$ready" ] || { docker logs mysql | tail -20; exit 1; }
          docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
            -e "CREATE DATABASE keelwatch; CREATE DATABASE keelwatch_test;"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Apply migrations to the test database
        working-directory: api
        run: |
          composer install --no-interaction --no-progress --no-dev
          php bin/migrate.php --test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: worker
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        working-directory: worker
        run: pytest

      - name: Integration tests
        working-directory: worker
        run: pytest -m integration

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests (responsive overflow, keyboard, states)
        working-directory: web
        run: npm run test:e2e
