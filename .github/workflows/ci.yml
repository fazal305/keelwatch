name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (PHP)
    runs-on: ubuntu-latest
    # Shared with the worker job. Job-level, not workflow-wide: docker compose
    # would let these override the containers job's .env.
    env: &test-env
      APP_ENV: test
      APP_VERSION: ci
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: keelwatch
      DB_TEST_NAME: keelwatch_test
      DB_USER: root
    steps:
      - uses: actions/checkout@v7

      # Throwaway secrets for a container and a job that live only for this run.
      - name: Generate job secrets
        run: |
          pw="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "::add-mask::$app"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "APP_SECRET=$app" >> "$GITHUB_ENV"

      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.4
          # The image first runs a temporary server (socket only, before the
          # root password is set) that already answers mysqladmin ping. Wait
          # for an authenticated query over TCP, which only the final server
          # accepts.
          for i in $(seq 1 60); do
            docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
              -e "SELECT 1" >/dev/null 2>&1 && ready=1 && break
            sleep 2
          done
          [ -n "$ready" ] || { docker logs mysql | tail -20; exit 1; }
          docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
            -e "CREATE DATABASE keelwatch; CREATE DATABASE keelwatch_test;"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Install dependencies
        working-directory: api
        run: composer install --no-interaction --no-progress

      - name: Lint
        working-directory: api
        run: php bin/lint.php

      - name: Unit and contract tests
        working-directory: api
        run: vendor/bin/phpunit --testsuite unit,contract

      - name: Integration tests
        working-directory: api
        run: vendor/bin/phpunit --testsuite integration

  worker:
    name: Worker (Python)
    runs-on: ubuntu-latest
    env: *test-env
    needs: api
    steps:
      - uses: actions/checkout@v7

      - name: Generate job secrets
        run: |
          pw="$(openssl rand -hex 24)"
          app="$(openssl rand -hex 32)"
          echo "::add-mask::$pw"
          echo "::add-mask::$app"
          echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "APP_SECRET=$app" >> "$GITHUB_ENV"

      - name: Start MySQL 8.4
        run: |
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD="$DB_PASSWORD" mysql:8.4
          # The image first runs a temporary server (socket only, before the
          # root password is set) that already answers mysqladmin ping. Wait
          # for an authenticated query over TCP, which only the final server
          # accepts.
          for i in $(seq 1 60); do
            docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
              -e "SELECT 1" >/dev/null 2>&1 && ready=1 && break
            sleep 2
          done
          [ -n "$ready" ] || { docker logs mysql | tail -20; exit 1; }
          docker exec mysql mysql -h127.0.0.1 -uroot -p"$DB_PASSWORD" \
            -e "CREATE DATABASE keelwatch; CREATE DATABASE keelwatch_test;"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none

      - name: Apply migrations to the test database
        working-directory: api
        run: |
          composer install --no-interaction --no-progress --no-dev
          php bin/migrate.php --test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt

      - name: Install dependencies
        working-directory: worker
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: worker
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        working-directory: worker
        run: pytest

      - name: Integration tests
        working-directory: worker
        run: pytest -m integration

  web:
    name: Web (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Browser tests (responsive overflow, keyboard, states)
        working-directory: web
        run: npm run test:e2e

  containers:
    name: Containers (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Throwaway production-mode configuration for this run only.
      - name: Write .env
        run: |
          cp .env.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; }
          for name in DB_PASSWORD MYSQL_ROOT_PASSWORD APP_SECRET GITHUB_WEBHOOK_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            set_env "$name" "$value"
          done
          set_env APP_ENV production
          set_env SESSION_COOKIE_SECURE true
          set_env KEELWATCH_HTTP_PORT 8080
          set_env KEELWATCH_HTTPS_PORT 8443

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 90); do
            curl -skf https://localhost:8443/readyz && exit 0
            sleep 2
          done
          exit 1

      - name: Smoke test
        run: |
          set -eu
          base=https://localhost:8443
          test "$(docker compose ps -a migrate --format '{{.State}} {{.ExitCode}}')" = "exited 0"
          test "$(curl -sk -o /dev/null -w '%{http_code}' $base/)" = 200
          curl -skI $base/ | grep -qi "content-security-policy: default-src 'self'; script-src 'self'"
          test "$(curl -sk -o /dev/null -w '%{http_code}' $base/api/system/health)" = 401

          secret="$(sed -n 's/^GITHUB_WEBHOOK_SECRET=//p' .env)"
          body="$(cat api/tests/fixtures/github/push.json)"
          send() {
            curl -sk -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
              -H 'X-GitHub-Event: push' -H "X-GitHub-Delivery: $(cat /proc/sys/kernel/random/uuid)" \
              -H "X-Hub-Signature-256: sha256=$1" --data-binary "$body" $base/webhooks/github
          }
          sig="$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$secret" | sed 's/^.*= //')"
          test "$(send "$sig")" = 202
          test "$(send 0000)" = 401

          # The worker turns the delivery's event job into an analysis run.
          for i in $(seq 1 30); do
            done_jobs="$(docker compose exec -T db sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -N -u"$MYSQL_USER" "$MYSQL_DATABASE" \
              -e "SELECT COUNT(*) FROM jobs WHERE queue = '\''events'\'' AND status = '\''succeeded'\''"')"
            [ "$done_jobs" -ge 1 ] && break
            sleep 2
          done
          [ "$done_jobs" -ge 1 ]

          docker compose run --rm -T api php api/bin/user.php create ci-admin --role=admin >/dev/null
          docker compose ps

      - name: Logs
        if: failure()
        run: docker compose logs --no-color
